name: Upstream Check
on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    name: Check for template, OBS and dependency updates 🔎
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compare against upstream 🔍
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Compare against upstream 🔍
          set -euo pipefail

          template_base=$(tr -d '[:space:]' < .github/template-version)
          template_head=$(gh api repos/obsproject/obs-plugintemplate/commits/master --jq .sha)
          obs_pinned=$(jq -r '.dependencies["obs-studio"].version' buildspec.json)
          obs_latest=$(gh api repos/obsproject/obs-studio/releases/latest --jq .tag_name)

          body=''
          if [[ "${template_base}" != "${template_head}" ]]; then
            body+="- **Plugin template** has new commits: https://github.com/obsproject/obs-plugintemplate/compare/${template_base}...${template_head}"$'\n'
            body+="  To apply: run \`git diff ${template_base} ${template_head} > template.patch\` in a template checkout, then \`git apply -3 template.patch\` here, and set \`.github/template-version\` to ${template_head}."$'\n'
          fi
          # Patch releases rarely matter for plugins, so only flag a new major or minor.
          if [[ "$(cut -d. -f1-2 <<< "${obs_pinned}")" != "$(cut -d. -f1-2 <<< "${obs_latest}")" ]]; then
            body+="- **OBS Studio ${obs_latest}** is out; \`buildspec.json\` pins ${obs_pinned}: https://github.com/obsproject/obs-studio/releases/tag/${obs_latest}"$'\n'
            body+="  Bumping it needs new dependency hashes and a test build."$'\n'
          fi

          # whisper.cpp, pinned by release and commit in src/whisper.cmake.
          if [[ -f src/whisper.cmake ]]; then
            whisper_pinned=$(sed -n 's/^set(_whisper_version \(v[^)]*\))$/\1/p' src/whisper.cmake)
            whisper_latest=$(gh api repos/ggml-org/whisper.cpp/releases/latest --jq .tag_name) || whisper_latest=''
            if [[ -z "${whisper_latest}" ]]; then
              body+="- **whisper.cpp**: could not look up its latest release; check https://github.com/ggml-org/whisper.cpp/releases by hand."$'\n'
            elif [[ -z "${whisper_pinned}" ]]; then
              body+="- **whisper.cpp**: could not read \`_whisper_version\` from \`src/whisper.cmake\`, so this check needs updating."$'\n'
            elif [[ "${whisper_pinned}" != "${whisper_latest}" ]]; then
              body+="- **whisper.cpp ${whisper_latest}** is out; \`src/whisper.cmake\` pins ${whisper_pinned}: https://github.com/ggml-org/whisper.cpp/compare/${whisper_pinned}...${whisper_latest}"$'\n'
              body+="  Bumping it means updating \`_whisper_version\` and \`_whisper_commit\`, checking the model SHA-1 against that release's models/README.md, and a test build."$'\n'
            fi
          fi

          # GitHub Actions used by the workflows, pinned by major version
          # (actions/checkout@v4) or by commit. Flag a new major version, or
          # a newer release for a commit pin.
          while read -r action ref; do
            repo=$(cut -d/ -f1-2 <<< "${action}")
            latest=$(gh api "repos/${repo}/releases/latest" --jq .tag_name 2>/dev/null) || continue
            if [[ "${ref}" =~ ^[0-9a-f]{40}$ ]]; then
              latest_sha=$(gh api "repos/${repo}/commits/${latest}" --jq .sha 2>/dev/null) || continue
              [[ "${ref}" == "${latest_sha}" ]] && continue
              body+="- **${repo} ${latest}** is out; the workflows pin commit ${ref:0:7}: https://github.com/${repo}/compare/${ref}...${latest}"$'\n'
            elif [[ "$(cut -d. -f1 <<< "${ref#v}")" != "$(cut -d. -f1 <<< "${latest#v}")" ]]; then
              body+="- **${repo} ${latest}** is out; the workflows use @${ref}: https://github.com/${repo}/releases/tag/${latest}"$'\n'
            fi
          done < <(grep -rhoE 'uses: *[^./][^ @]*@[^ ]+' .github/workflows .github/actions \
                     | sed -E 's/uses: *//; s/@/ /' | sort -u)

          if [[ -z "${body}" ]]; then
            echo "Template, OBS, whisper.cpp and actions are all current."
            exit 0
          fi

          title='Upstream update available'
          existing=$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body "Still pending as of $(date -u +%F):"$'\n\n'"${body}"
          else
            gh issue create --title "${title}" --body "Found by the monthly upstream check:"$'\n\n'"${body}"
          fi
