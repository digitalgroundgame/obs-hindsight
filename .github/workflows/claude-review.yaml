name: Claude Review 🔍
on:
  # Reviews once per PR to keep cost down. To re-review after new pushes,
  # comment "@claude review this PR again" (handled by claude.yaml).
  pull_request:
    paths-ignore:
      - '**.md'
    branches: [main]
    types: [opened, ready_for_review]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    name: Review pull request
    # Skip drafts, and PRs from forks and Dependabot (they cannot read the
    # auth secret).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Set only one of these two repository secrets.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Posts a "Claude is reviewing" comment that ticks off progress and
          # ends up holding the review summary.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR's head commit is checked out in the working directory.
            Read .github/claude-review.md first and follow it.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for issues tied to
            specific lines. Put your overall summary, or a note that it looks good, in the progress comment.
            Use `gh pr comment` only for feedback that fits neither, not to repeat the summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
