name: Code Checks
run-name: ${{ github.event.pull_request.title || github.ref_name }} code checks 🧪
on:
  workflow_dispatch:
  # Pushes to main run these through push.yaml, so they gate the release.
  workflow_call:
  pull_request:
    paths-ignore:
      - '**.md'
    branches: [master, main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Unit Tests 🧪 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      CONFIG: Debug
    defaults:
      run:
        # Bash on every runner (Git Bash on Windows), so a failing command
        # fails the step everywhere.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            os: ubuntu-24.04
            sanitize: 'OFF'
          - name: ASan + UBSan
            os: ubuntu-24.04
            sanitize: 'ON'
          # The only run of the Windows-only code, like the DPAPI key
          # encryption in secret-seal.cpp, before it reaches streamers.
          # MSVC has no UBSan, so no sanitizer run here.
          - name: Windows
            os: windows-2022
            sanitize: 'OFF'
    steps:
      - uses: actions/checkout@v7

      - name: Build Tests 🧱
        run: |
          cmake -S tests -B build_tests -DCMAKE_BUILD_TYPE=${CONFIG} -DHINDSIGHT_SANITIZE=${{ matrix.sanitize }}
          cmake --build build_tests --parallel --config ${CONFIG}

      - name: Run Tests 🧪
        env:
          ASAN_OPTIONS: ${{ matrix.sanitize == 'ON' && 'detect_leaks=1:abort_on_error=1' || '' }}
          UBSAN_OPTIONS: ${{ matrix.sanitize == 'ON' && 'print_stacktrace=1:halt_on_error=1' || '' }}
        # --no-tests=error: a job that finds no tests (say, the wrong
        # configuration on Windows) fails instead of passing.
        run: ctest --test-dir build_tests -C ${CONFIG} --output-on-failure --no-tests=error

  clang-tidy:
    name: clang-tidy 🔬
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Dependencies 🛍️
        run: |
          # The libobs packages from the template's Ubuntu build
          # (.github/scripts/utils.zsh/setup_ubuntu), plus the clang tools.
          sudo add-apt-repository --yes ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y obs-studio libsimde-dev libgles2-mesa-dev qt6-base-dev libcurl4-openssl-dev ninja-build clang-18 clang-tidy-18

      - name: Generate Compile Commands ⚙️
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake --preset ubuntu-x86_64 -B build_tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake -S tests -B build_tests

      - name: Run clang-tidy 🔬
        run: |
          # The full path, so whisper.cpp's own src/ folder (fetched into
          # the build folder) isn't checked too.
          run-clang-tidy-18 -quiet -p build_tidy "$PWD/src/"
          run-clang-tidy-18 -quiet -p build_tests tests/
