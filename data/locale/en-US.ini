Hindsight.AutoModel="Pick the model automatically"
Hindsight.AutoModelNote="Before each answer, Claude Haiku checks whether the question needs a smarter model: quick facts stay on Haiku, harder questions go to Claude Sonnet. The check adds about a second and a small fraction of a cent. Turn it off to choose the model yourself."
Hindsight.ClaudeModel="Model"
Hindsight.ClaudeModelNote="Which Claude model answers. Haiku answers in a few seconds for a fraction of a cent; Sonnet and Opus think harder, take longer and cost more. Billed to your Claude API key."
