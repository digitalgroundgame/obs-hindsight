Hindsight.WebSearch="Search the web for current information"
Hindsight.WebFetch="Fetch web pages from the search results"
Hindsight.WebFetchNote="Lets Claude open up to 2 pages it found by searching when a result's snippet doesn't hold the answer. There's no fee, but each page adds tokens to the cost and a few seconds to the wait. Needs Search the web."
Hindsight.WebSearchNote="Lets Claude look up news, scores, prices and other recent facts before answering, up to 3 searches a question. Each search adds a second or two and costs $0.01. Turn it off and Claude answers from what it knows, which may be out of date."
